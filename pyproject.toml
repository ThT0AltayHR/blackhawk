[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackhawk"
version = "1.0.1"
description = "Termux uyumlu, yetkili kamu kaynakları için etik izleme terminali"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
textual = ["textual>=0.60"]
test = ["pytest>=8"]

[project.scripts]
blackhawk = "blackhawk.cli:main"

[tool.setuptools.packages.find]
include = ["blackhawk*"]

[tool.pytest.ini_options]
testpaths = ["blackhawk/tests"]
